<style>

html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;margin:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
.btn-shine::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,var(--shine,rgba(255,255,255,.38)) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s;pointer-events:none}
.btn-shine:hover::after{transform:translateX(120%)}
.soc:hover{background:var(--h);color:#fff;border-color:transparent}
.font-serif{font-weight:400!important;letter-spacing:.01em}
.arch{border-radius:999px 999px 18px 18px}
.zoom img{transition:transform .7s cubic-bezier(.2,.7,.2,1)}

@media (prefers-reduced-motion:reduce){.pulse{animation:none}.zoom img{transition:none}html{scroll-behavior:auto}}

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

const OWNER="Flor Amada";
const WA="5522997582026", PHONE="+55 (22) 99758-2026";

const DIR="https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(GEO);

const FB="https://www.facebook.com/search/top?q="+encodeURIComponent("Flor Amada semijoias Rio das Ostras");

const BRAND={
  Instagram:[["rect",{x:3,y:3,width:18,height:18,rx:5}],["circle",{cx:12,cy:12,r:4}],["circle",{cx:17.5,cy:6.5,r:.6,fill:"currentColor"}]],
  Facebook:[["path",{d:"M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"}]],
  WhatsApp:[["path",{d:"M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"}],["path",{d:"M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"}]]};
function pick(n){
  if(BRAND[n])return BRAND[n];
  const L=window.lucide&&lucide.icons; if(!L)return [];
  const v=L[n]||L[n.replace(/[A-Z]/g,(c,i)=>(i?"-":"")+c.toLowerCase())]||[];
  return v[0]==="svg"?v[2]:v;
}
function Icon({n,size=20,className=""}){
  const nodes=pick(n);
  return <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">{nodes.map(([t,a],i)=>React.createElement(t,{...a,key:i}))}</svg>;
}
const Btn=({href,icon,children,tone="solid",className=""})=>(

  </a>);

function Header(){

function Hero(){
  return <section id="topo">

const CATS=[

  {t:"Tornozeleiras",d:"Detalhes que completam o look.",img:IMG.TORNOZELEIRA,c:"",msg:"Quero ver as tornozeleiras"},
  {t:"Para Presentear",d:"Peças delicadas em embalagem própria.",img:IMG.CORACAO,c:"",msg:"Quero uma sugestão de presente"},

const INTERESTS=["Semijoias","Colares e brincos","Cintos","Tornozeleiras","Bolsas","Presente"];
function Consultora(){

const REVIEWS=[

  const [o,setO]=useState(false);
